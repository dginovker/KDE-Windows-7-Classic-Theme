<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Windows 7 renders Classic UI text with ClearType (RGB subpixel). Applies only to the Tahoma files
     install.sh copies, so current mode and any other copy of Tahoma keep their own rendering.
     Measured against reference/screenshots/w7-menu.png by tests/test_text.py; full hinting was tried and
     makes labels 4-8px wider than Windows. -->
<fontconfig>
  <match target="font">
    <test name="file" compare="contains"><string>/fonts/win7-classic/</string></test>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
